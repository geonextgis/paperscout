name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
  # Called by update-papers.yml after it commits a new catalogue (commits made
  # with GITHUB_TOKEN do not trigger `push` workflows on their own).
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Branch head rather than the triggering SHA, so a catalogue commit
          # made earlier in the same run is included.
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
