name: Update papers

on:
  schedule:
    - cron: '17 4 * * *' # daily, 04:17 UTC (off the hour to avoid the scheduler rush)
  workflow_dispatch:

permissions:
  contents: write # commit the regenerated catalogue
  pages: write # required by the reusable deploy workflow
  id-token: write

concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Fetch, normalize, deduplicate and merge
        run: npm run fetch-papers
        env:
          # Secrets exist only inside this job. They are never written to the
          # generated data and never reach the browser bundle.
          WOS_API_KEY: ${{ secrets.WOS_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
          WOS_MAX_REQUESTS: ${{ vars.WOS_MAX_REQUESTS }}
          WOS_REQUESTS_PER_SECOND: ${{ vars.WOS_REQUESTS_PER_SECOND }}

      - name: Commit catalogue
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes in the catalogue."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): update catalogue $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
